<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Borde decorativo geométrico -->
  
  <!-- Marco exterior -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="currentColor" stroke-width="3"/>
  
  <!-- Línea interior decorativa -->
  <rect x="20" y="20" width="160" height="160" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/>
  
  <!-- Esquinas decorativas -->
  <circle cx="20" cy="20" r="4" fill="currentColor" opacity="0.6"/>
  <circle cx="180" cy="20" r="4" fill="currentColor" opacity="0.6"/>
  <circle cx="180" cy="180" r="4" fill="currentColor" opacity="0.6"/>
  <circle cx="20" cy="180" r="4" fill="currentColor" opacity="0.6"/>
  
  <!-- Centros de lados -->
  <circle cx="100" cy="15" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="185" cy="100" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="100" cy="185" r="3" fill="currentColor" opacity="0.6"/>
  <circle cx="15" cy="100" r="3" fill="currentColor" opacity="0.6"/>
</svg>